# Sources de veille cyber.
#
# Le contenu de ces flux appartient à leurs éditeurs. Le bot ne republie rien :
# il résume et renvoie vers l'original. Avant d'ajouter une source, vérifier
# que son flux RSS est public et destiné à la syndication.
# weight : bonus de score appliqué aux articles de cette source (0 = neutre).
#          Utile pour privilégier les sources officielles (CERT-FR, CISA).
# enabled : passe à false pour désactiver sans supprimer.
#
# NB : les URL de flux changent parfois. Si une source remonte 0 article
#      pendant plusieurs jours, vérifie son URL dans un navigateur.

feeds:
  # --- Sources francophones / officielles ---
  - name: CERT-FR (ANSSI)
    url: https://www.cert.ssi.gouv.fr/feed/
    enabled: true
    weight: 3

  - name: CISA Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    enabled: true
    weight: 3

  # --- Presse spécialisée ---
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    enabled: true
    weight: 2

  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    enabled: true
    weight: 1

  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    enabled: true
    weight: 2

  - name: The Record
    url: https://therecord.media/feed
    enabled: true
    weight: 1

  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
    enabled: true
    weight: 1

  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    enabled: false
    weight: 0

  # --- Recherche / threat intel ---
  - name: Google Project Zero
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    enabled: false
    weight: 2

  - name: Sekoia Blog
    url: https://blog.sekoia.io/feed/
    enabled: false
    weight: 1
