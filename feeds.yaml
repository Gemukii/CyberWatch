# Cybersecurity watch sources.
#
# The content of these feeds belongs to their publishers. The bot never
# republishes it: it summarizes and links back to the original. Before
# adding a source, check that its RSS feed is public and meant for syndication.
# weight: score bonus applied to articles from this source (0 = neutral).
#         Useful to favor official sources (CERT-FR, CISA).
# enabled: set to false to disable without deleting.
#
# Note: feed URLs sometimes change. If a source returns 0 articles for
#       several days, check its URL in a browser.

feeds:
  # --- French-language / official sources ---
  - name: CERT-FR (ANSSI)
    url: https://www.cert.ssi.gouv.fr/feed/
    enabled: true
    weight: 3

  - name: CISA Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    enabled: true
    weight: 3

  # --- Trade press ---
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    enabled: true
    weight: 2

  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    enabled: true
    weight: 1

  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    enabled: true
    weight: 2

  - name: The Record
    url: https://therecord.media/feed
    enabled: true
    weight: 1

  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
    enabled: true
    weight: 1

  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    enabled: false
    weight: 0

  # --- Research / threat intel ---
  - name: Google Project Zero
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    enabled: false
    weight: 2

  - name: Sekoia Blog
    url: https://blog.sekoia.io/feed/
    enabled: false
    weight: 1