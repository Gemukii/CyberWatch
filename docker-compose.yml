services:
  cyberwatch:
    build: .
    image: cyberwatch:latest
    container_name: cyberwatch
    restart: unless-stopped

    # All configuration comes from .env
    env_file: .env

    # Needed so DIGEST_HOUR matches local time.
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}

    # --- Hardening ---
    # The bot writes nothing: the filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # --- Resource guardrails (modest VPS) ---
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

    # Bounded logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"