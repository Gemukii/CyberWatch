name: watch

on:
  schedule:
    # Off the hour: GitHub delays runs most at the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read Discord but post nothing"
        type: boolean
        default: true
      force_digest:
        description: "Send the digest now"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, queued rather than cancelled: two overlapping runs would
# both read the same history and publish the same articles.
concurrency:
  group: cyberwatch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
      # This model rejects thinkingBudget: 0.
      GEMINI_DISABLE_THINKING: "false"
      TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_DIGEST: ${{ inputs.force_digest }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE_DIGEST" = "true" ] && args+=(--force-digest)
          python run_once.py "${args[@]}"
